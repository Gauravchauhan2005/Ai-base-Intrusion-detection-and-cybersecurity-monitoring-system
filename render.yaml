services:
  # 1. FastAPI ASGI Backend
  - type: web
    name: aetheris-ids-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aetheris-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false # Set to your free Upstash Redis or Render Redis URL
      - key: STREAM_BACKEND
        value: redis
      - key: STREAM_TOPIC
        value: network_traffic_stream
      - key: CONSUMER_GROUP
        value: ids_inference_group
      - key: AUTO_START_CONSUMER
        value: "true"
      - key: LOG_LEVEL
        value: INFO

  # 2. Next.js 14 SOC Dashboard
  - type: web
    name: aetheris-ids-frontend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://<your-backend-service>.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        sync: false # Set to wss://<your-backend-service>.onrender.com/ws/live-stream

databases:
  # 3. Managed PostgreSQL 16
  - name: aetheris-postgres
    plan: free
    region: oregon
    databaseName: ids_db
    user: ids_user
