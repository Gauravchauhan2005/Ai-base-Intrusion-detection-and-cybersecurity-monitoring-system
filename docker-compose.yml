version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ids_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ids_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ids_password}
      POSTGRES_DB: ${POSTGRES_DB:-ids_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ids_user -d ids_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ids_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ids_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ids_user:ids_password@postgres:5432/ids_db
      REDIS_URL: redis://redis:6379/0
      STREAM_BACKEND: redis
      STREAM_TOPIC: network_traffic_stream
      CONSUMER_GROUP: ids_inference_group
      AUTO_START_CONSUMER: "true"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: ids_producer
    restart: unless-stopped
    environment:
      STREAM_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      STREAM_TOPIC: network_traffic_stream
      REPLAY_RATE_EPS: 25
      BURST_INTERVAL_SEC: 20
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ids_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/live-stream
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
